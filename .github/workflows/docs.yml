# 📚 Documentation Workflow
# Validates and deploys documentation
# Checks: Markdown validation, broken links
# Deploys: GitHub Pages

name: 📚 Documentation

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
  schedule:
    # Run weekly on Sunday at 4 AM UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    name: Validate Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📝 Validate Markdown
        uses: DavidAnson/markdownlint-cli2-action@v14
        with:
          globs: '**/*.md'
          config: '.markdownlint.json'
        continue-on-error: true

      - name: 🔗 Check for broken links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.markdown-link-check.json'
        continue-on-error: true

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Pages
        uses: actions/configure-pages@v4

      - name: 🏗️ Build documentation site
        run: |
          mkdir -p _site
          cp *.md _site/ || true
          cp -r docs _site/ || true
          echo "<h1>Safeway MCP Server Documentation</h1>" > _site/index.html
          echo "<ul>" >> _site/index.html
          for file in _site/*.md; do
            basename="${file##*/}"
            echo "<li><a href='$basename'>$basename</a></li>" >> _site/index.html
          done
          echo "</ul>" >> _site/index.html

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
