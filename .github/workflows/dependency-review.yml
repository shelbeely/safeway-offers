# 🐛 Dependency Review Workflow
# Blocks PRs with vulnerable or incompatible dependencies
# Runs: On every pull request
# Checks: Security vulnerabilities, license compatibility

name: 🐛 Dependency Review

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail if vulnerabilities with moderate or higher severity
          fail-on-severity: moderate
          # Allow these licenses
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Python-2.0
          # Comment PR with results
          comment-summary-in-pr: always
