# 🎨 Code Quality Workflow
# Checks code formatting, style, types, and quality
# Tools: Black, Flake8, MyPy, Bandit, ESLint
# Runs: On every push and PR

name: 🎨 Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy bandit[toml]
          pip install -r requirements.txt

      - name: 🎨 Check formatting with Black
        run: black --check --diff .

      - name: 📏 Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🔍 Type check with MyPy
        run: |
          mypy safeway_api.py safeway_mcp_server.py --ignore-missing-imports || true

      - name: 🔒 Security lint with Bandit
        run: bandit -r . -ll

  javascript-quality:
    name: JavaScript Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      - name: 🎨 Lint with ESLint
        run: |
          if [ -f package.json ]; then
            npx eslint . --ext .js,.jsx,.ts,.tsx || true
          fi
