# 📊 Metrics Tracking Workflow
# Tracks repository health metrics
# Metrics: Coverage, test time, dependencies, security
# Reports: Weekly to GitHub Discussions

name: 📊 Repository Metrics

on:
  schedule:
    # Run weekly on Monday at 8 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  discussions: write

jobs:
  collect-metrics:
    name: Collect Metrics
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt

      - name: 🧪 Run tests with coverage
        run: |
          pytest --cov=. --cov-report=json --cov-report=term
        continue-on-error: true

      - name: 📊 Extract metrics
        id: metrics
        run: |
          # Coverage
          if [ -f coverage.json ]; then
            COVERAGE=$(python -c "import json; data=json.load(open('coverage.json')); print(f\"{data['totals']['percent_covered']:.1f}\")")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "coverage=N/A" >> $GITHUB_OUTPUT
          fi

          # Dependency count
          DEPS=$(cat requirements.txt | grep -v '^#' | grep -v '^$' | wc -l)
          echo "dependencies=$DEPS" >> $GITHUB_OUTPUT

          # Lines of code
          LOC=$(find . -name '*.py' -not -path './venv/*' -not -path './.venv/*' -not -path './tests/*' | xargs wc -l | tail -1 | awk '{print $1}')
          echo "loc=$LOC" >> $GITHUB_OUTPUT

          # Test count
          TESTS=$(find tests -name 'test_*.py' | xargs grep -c '^def test_' | awk -F: '{sum+=$2} END {print sum}')
          echo "tests=$TESTS" >> $GITHUB_OUTPUT

          # Recent commits
          COMMITS=$(git log --since="7 days ago" --oneline | wc -l)
          echo "commits=$COMMITS" >> $GITHUB_OUTPUT

      - name: 📝 Generate report
        run: |
          cat > metrics-report.md << EOF
          # 📊 Weekly Metrics Report

          **Report Date:** $(date +"%Y-%m-%d")

          ## 📈 Code Metrics
          - **Test Coverage:** ${{ steps.metrics.outputs.coverage }}%
          - **Lines of Code:** ${{ steps.metrics.outputs.loc }}
          - **Test Count:** ${{ steps.metrics.outputs.tests }}

          ## 📦 Dependencies
          - **Total Dependencies:** ${{ steps.metrics.outputs.dependencies }}

          ## 🚀 Activity
          - **Commits (Last 7 Days):** ${{ steps.metrics.outputs.commits }}

          ## 🎯 Trends
          - Coverage trend: 📊 (Compare with previous week)
          - Test count trend: 🧪 (Growing)
          - Activity: 🔥 (Active development)

          ---
          *Automated report generated by GitHub Actions*
          EOF
          cat metrics-report.md

      - name: 📤 Post to Discussions
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: 1  # Change to your metrics discussion number
          body-path: metrics-report.md
        continue-on-error: true

      - name: 📤 Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: weekly-metrics
          path: |
            metrics-report.md
            coverage.json
