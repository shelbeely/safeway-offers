name: Load Safeway Offers

on:
  schedule:
    # Run every Sunday at 8 AM UTC
    - cron: '0 8 * * 0'
  workflow_dispatch:  # Allow manual triggering

jobs:
  load-offers:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Load Safeway offers
      env:
        SAFEWAY_USERNAME: ${{ secrets.SAFEWAY_USERNAME }}
        SAFEWAY_PASSWORD: ${{ secrets.SAFEWAY_PASSWORD }}
        SAFEWAY_STORE_ID: ${{ secrets.SAFEWAY_STORE_ID }}
      run: |
        python safeway_api.py
    
    - name: Report results
      if: always()
      run: |
        echo "Offer loading completed"
        echo "Check the logs above for details"
