# 🐍 Setup Python Environment
# Reusable composite action for setting up Python with caching
# Usage: - uses: ./.github/actions/setup-python

name: 🐍 Setup Python Environment
description: Sets up Python with pip caching and common dependencies

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  cache-dependencies:
    description: 'Enable dependency caching'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: 🐍 Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache-dependencies == 'true' && 'pip' || '' }}

    - name: 📦 Upgrade pip
      shell: bash
      run: python -m pip install --upgrade pip setuptools wheel

    - name: 📥 Install dependencies
      if: inputs.cache-dependencies == 'true'
      shell: bash
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
