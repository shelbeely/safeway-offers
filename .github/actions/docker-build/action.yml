# 🐳 Docker Build
# Reusable composite action for building Docker images
# Usage: - uses: ./.github/actions/docker-build

name: 🐳 Docker Build
description: Builds and optionally pushes Docker images

inputs:
  dockerfile:
    description: 'Path to Dockerfile'
    required: false
    default: './deployment/docker/Dockerfile'
  image-name:
    description: 'Docker image name'
    required: true
  image-tag:
    description: 'Docker image tag'
    required: false
    default: 'latest'
  push:
    description: 'Push image to registry'
    required: false
    default: 'false'
  registry-username:
    description: 'Docker registry username'
    required: false
  registry-password:
    description: 'Docker registry password'
    required: false

outputs:
  image:
    description: 'Full image name with tag'
    value: ${{ steps.build.outputs.imageid }}

runs:
  using: composite
  steps:
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔐 Login to Docker Hub
      if: inputs.push == 'true' && inputs.registry-username != '' && inputs.registry-password != ''
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: 🏗️ Build Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.image-name }}:${{ inputs.image-tag }},${{ inputs.image-name }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: 📊 Image size
      shell: bash
      run: |
        if [ "${{ inputs.push }}" == "false" ]; then
          docker images ${{ inputs.image-name }}:${{ inputs.image-tag }}
        fi
