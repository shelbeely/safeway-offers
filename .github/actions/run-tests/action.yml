# 🧪 Run Tests
# Reusable composite action for running pytest with coverage
# Usage: - uses: ./.github/actions/run-tests

name: 🧪 Run Tests
description: Runs pytest with coverage reporting

inputs:
  python-version:
    description: 'Python version for test display'
    required: true
  upload-coverage:
    description: 'Upload coverage to Codecov'
    required: false
    default: 'true'
  codecov-token:
    description: 'Codecov token'
    required: false

outputs:
  coverage:
    description: 'Coverage percentage'
    value: ${{ steps.coverage.outputs.percentage }}

runs:
  using: composite
  steps:
    - name: 📦 Install test dependencies
      shell: bash
      run: |
        pip install pytest pytest-cov pytest-asyncio pytest-mock

    - name: 🧪 Run pytest
      shell: bash
      run: |
        pytest -v --cov=. --cov-report=xml --cov-report=term --cov-report=html

    - name: 📊 Extract coverage
      id: coverage
      shell: bash
      run: |
        COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(f\"{float(root.attrib['line-rate'])*100:.1f}\")")
        echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
        echo "Coverage: $COVERAGE%"

    - name: 📤 Upload coverage to Codecov
      if: inputs.upload-coverage == 'true' && inputs.codecov-token != ''
      uses: codecov/codecov-action@v4
      with:
        token: ${{ inputs.codecov-token }}
        files: ./coverage.xml
        flags: python-${{ inputs.python-version }}
        name: Python ${{ inputs.python-version }}
        fail_ci_if_error: false

    - name: 📤 Upload coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-python-${{ inputs.python-version }}
        path: |
          coverage.xml
          htmlcov/
        if-no-files-found: ignore
